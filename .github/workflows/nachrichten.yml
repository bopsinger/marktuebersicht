# Holt alle 5 Minuten die Schlagzeilen und legt sie als einzige Datei in den Zweig "nachrichten".
# Die Seite liest sie von dort direkt; so ist kein neues Veröffentlichen der Seite nötig.
# GitHub startet geplante Abläufe nach bestem Bemühen; Verzögerungen von einigen Minuten sind normal.
name: Nachrichten aktualisieren

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nachrichten
  cancel-in-progress: true

jobs:
  nachrichten:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Schlagzeilen abrufen
        run: |
          mkdir -p neu
          python abruf.py --nachrichten neu
      - name: In den Zweig "nachrichten" schreiben
        run: |
          n=$(python -c "import json; print(len(json.load(open('neu/news.json'))['rows']))")
          if [ "$n" -lt 5 ]; then echo "Zu wenige Meldungen ($n), behalte alten Stand"; exit 0; fi
          cd neu
          git init -q -b nachrichten
          git config user.name "marktuebersicht-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          git commit -q -m "Nachrichten"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" nachrichten
