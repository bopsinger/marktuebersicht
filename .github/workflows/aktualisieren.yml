# Holt alle Daten neu, baut die Seite und veröffentlicht sie über GitHub Pages.
# Läuft bei jeder Änderung am Code und auf Knopfdruck ("Run workflow"); die laufende
# Aktualisierung während der Börsenzeit übernimmt dauerlauf.yml.
name: Daten aktualisieren

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aktualisieren
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten abrufen
        run: |
          mkdir -p neu
          python abruf.py neu daten/aktien.json | tee bericht.json
          python uebernehmen.py
      - name: Daten sichern
        run: |
          git config user.name "marktuebersicht-bot"
          git config user.email "actions@users.noreply.github.com"
          git add daten
          git diff --cached --quiet || git commit -m "Daten aktualisiert" && git push || true
      - name: In den Zweig "live" schreiben
        run: bash zweig_schreiben.sh "${{ github.token }}" "${{ github.repository }}"
      - name: Seite bauen
        run: |
          python baue_seite.py site
          cp -r daten site/daten
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: pages
        uses: actions/deploy-pages@v4
