# Laufende Aktualisierung an Werktagen von 06:00 bis 22:00 UTC (07 bis 23 Uhr Schweizer Winterzeit):
# Nachrichten alle 10 Minuten, alle übrigen Daten stündlich. Ein Lauf dauert höchstens rund 5 Stunden 40 Minuten
# und startet sich danach selbst neu. Der Zeitplan unten startet ihn morgens und fängt ab, falls die Kette abreisst;
# dank "concurrency" läuft trotzdem immer nur einer.
name: Dauerlauf

on:
  schedule:
    - cron: "3 6,9,12,15,18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dauerlauf
  cancel-in-progress: false

jobs:
  dauerlauf:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Schleife
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          start=$(date +%s)
          letzter_voll=0
          imfenster() { [ "$(date -u +%u)" -le 5 ] && [ "$(date -u +%H)" -ge 6 ] && [ "$(date -u +%H)" -lt 22 ]; }
          while imfenster && [ $(( $(date +%s) - start )) -lt 20400 ]; do
            runde=$(date +%s)
            rm -rf neu && mkdir -p neu
            if [ $(( $(date +%s) - letzter_voll )) -ge 3600 ]; then
              python abruf.py neu daten/aktien.json > bericht.json || true
              letzter_voll=$(date +%s)
            else
              python abruf.py --nachrichten neu > bericht.json || true
            fi
            python uebernehmen.py || true
            bash zweig_schreiben.sh "$TOKEN" "$REPO" || true
            rest=$(( 600 - ($(date +%s) - runde) ))   # eine Runde dauert 10 Minuten
            [ "$rest" -gt 30 ] && sleep "$rest" || sleep 30
          done
      - name: Neu starten, solange das Zeitfenster offen ist
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%u)" -le 5 ] && [ "$(date -u +%H)" -ge 6 ] && [ "$(date -u +%H)" -lt 22 ]; then
            gh workflow run dauerlauf.yml --repo "${{ github.repository }}" --ref main
          fi
