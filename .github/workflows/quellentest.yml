name: Quellentest
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          for u in \
           "https://www.ishares.com/us/products/239600/ishares-msci-acwi-etf/1467271812596.ajax?fileType=csv&fileName=ACWI_holdings&dataType=fund" \
           "https://www.ssga.com/us/en/intermediary/library-content/products/fund-data/etfs/us/holdings-daily-us-en-spgm.xlsx" \
           "https://investor.vanguard.com/investment-products/etfs/profile/api/VT/portfolio-holding/stock" \
           "https://investor.vanguard.com/investment-products/etfs/profile/api/VT/diversification" \
           "https://www.msci.com/documents/10199/8d97d244-4685-4200-a24c-3e2942e3adeb" \
          ; do echo "$(curl -s -L -o /tmp/x -w '%{http_code} %{size_download} %{content_type}' -m 40 -A "$A" "$u") $u"; head -c 300 /tmp/x | tr -d '\0' | tr '\n' ' '; echo; done
